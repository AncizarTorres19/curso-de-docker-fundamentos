services:
  backend:
    image: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=5000
    ports:
      - "5000:5000"
  frontend:
    image: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - BACKEND_URL=http://backend:5000
    ports:
      - "8082:80"
    depends_on:
      - backend
