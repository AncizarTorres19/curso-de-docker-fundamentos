<style>
:root {
  --bg: #0b0f14;
  --surface: #121821;
  --surface-hover: #182130;
  --border: #243041;
  --text: #e6edf3;
  --muted: #8b98a9;
  --accent: #38bdf8;
  --accent-strong: #0ea5e9;
}

* { box-sizing: border-box; margin: 0; }

body {
  min-height: 100vh;
  font-family: "Inter", system-ui, sans-serif;
  color: var(--text);
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(56, 189, 248, .14), transparent 70%),
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 32px 32px,
    var(--bg);
  display: flex;
  justify-content: center;
  padding: 48px 16px;
}

main { width: 100%; max-width: 480px; }

.profile { text-align: center; margin-bottom: 36px; }

.avatar {
  width: 128px;
  height: 128px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--accent);
  box-shadow: 0 0 0 6px rgba(56, 189, 248, .12);
}

h1 {
  font-family: "Space Grotesk", sans-serif;
  font-size: 1.9rem;
  font-weight: 700;
  letter-spacing: -.02em;
  margin-top: 18px;
}

.tagline { color: var(--muted); margin-top: 6px; font-size: .95rem; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: .8rem;
  color: var(--muted);
}

.badge::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
}

h2 {
  font-family: "Space Grotesk", sans-serif;
  font-size: .75rem;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 28px 0 12px 4px;
}

.links { display: grid; gap: 10px; }

.link {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  transition: background .15s, border-color .15s, transform .15s;
}

.link:hover {
  background: var(--surface-hover);
  border-left-color: var(--accent);
  transform: translateX(3px);
}

.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.link svg { width: 20px; height: 20px; flex-shrink: 0; color: var(--accent); }

.link span { flex: 1; }

.link .arrow { width: 16px; height: 16px; color: var(--muted); transition: color .15s; }

.link:hover .arrow { color: var(--accent); }

footer {
  margin-top: 40px;
  text-align: center;
  font-size: .85rem;
  color: var(--muted);
}

@media (prefers-reduced-motion: reduce) {
  .link { transition: none; }
  .link:hover { transform: none; }
}
</style>
